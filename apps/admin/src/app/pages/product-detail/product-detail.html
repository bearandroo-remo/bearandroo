<div class="page">
  <div class="page-header">
    <p-button icon="pi pi-arrow-left" severity="secondary" [text]="true" (onClick)="goBack()" />
    <h1>{{ product()?.name }}</h1>
  </div>

  <div class="detail-grid">
    <!-- Varyantlar -->
    <div class="card">
      <div class="card-header">
        <h2>Varyantlar</h2>
        <p-button label="Yeni Varyant" icon="pi pi-plus" size="small" (onClick)="openVariantDialog()" />
      </div>
      <p-table [value]="variants()" [loading]="loading()">
        <ng-template pTemplate="header">
          <tr>
            <th>SKU</th>
            <th>Fiyat</th>
            <th>Stok</th>
            <th>Attributes</th>
            <th>İşlem</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-variant>
          <tr>
            <td>{{ variant.sku }}</td>
            <td>{{ variant.price }} ₺</td>
            <td>{{ variant.stock }}</td>
            <td>{{ formatAttributes(variant.attributes) }}</td>
            <td>
              <p-button icon="pi pi-pencil" severity="secondary" [text]="true" (onClick)="openVariantDialog(variant)" />
              <p-button icon="pi pi-trash" severity="danger" [text]="true" (onClick)="deleteVariant(variant.id)" />
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>

    <!-- Resimler -->
    <div class="card">
      <div class="card-header">
        <h2>Resimler</h2>
        <p-button label="Resim Yükle" icon="pi pi-upload" size="small" (onClick)="openImageDialog()" />
      </div>
      <div class="images-grid">
        <div *ngFor="let image of images()" class="image-item" [class.main]="image.isMain">
          <p-image [src]="image.url" [preview]="true" width="100" height="100" [imageStyle]="{'object-fit':'cover','border-radius':'6px'}" />

          <div class="image-badge" *ngIf="image.isMain">Ana</div>
          <div class="image-variant" *ngIf="getVariantName(image.variantId)">
            {{ getVariantName(image.variantId) }}
          </div>
          <div class="image-actions">
            <p-button *ngIf="!image.isMain" icon="pi pi-star" severity="contrast" size="small" (onClick)="setMain(image.id)" />
            <p-button icon="pi pi-trash" severity="danger" size="small" (onClick)="deleteImage(image.id)" />
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Resim Upload Dialog -->
<p-dialog [(visible)]="imageDialogVisible" header="Resim Yükle" [modal]="true" [style]="{width: '400px'}">
  <div class="field">
    <label>Varyant (opsiyonel)</label>
    <p-select [options]="variantOptions()" optionLabel="label" optionValue="value"
              [(ngModel)]="imageForm.variantId" placeholder="Genel ürün resmi"
              [showClear]="true" appendTo="body" class="w-full" />
  </div>
  <div class="field">
    <label>Ana resim mi?</label>
    <p-checkbox [(ngModel)]="imageForm.isMain" [binary]="true" />
  </div>
  <div class="field">
    <label>Resim</label>
    <input #fileInput2 type="file" accept="image/*" (change)="onFileSelected($event)" />
  </div>
  <ng-template pTemplate="footer">
    <p-button label="İptal" severity="secondary" (onClick)="imageDialogVisible = false" />
    <p-button label="Yükle" (onClick)="uploadImage()" [loading]="uploading()" [disabled]="!selectedFile" />
  </ng-template>
</p-dialog>

<!-- Varyant Dialog -->
<p-dialog [(visible)]="variantDialogVisible" [header]="editingVariantId() ? 'Varyant Düzenle' : 'Yeni Varyant'"
          [modal]="true" [style]="{width: '500px'}">
  <div class="field">
    <label>SKU</label>
    <input pInputText [(ngModel)]="variantForm.sku" class="w-full" />
  </div>
  <div class="field">
    <label>Fiyat</label>
    <p-inputnumber [(ngModel)]="variantForm.price" mode="decimal" [minFractionDigits]="2" class="w-full" />
  </div>
  <div class="field">
    <label>Stok</label>
    <p-inputnumber [(ngModel)]="variantForm.stock" [useGrouping]="false" class="w-full" />
  </div>
  <div class="field">
    <label>Özellikler</label>
    <div *ngFor="let attr of variantForm.attributes; let i = index" class="attr-row">
      <input pInputText [(ngModel)]="attr.key" placeholder="Özellik (örn: Renk)" />
      <input pInputText [(ngModel)]="attr.value" placeholder="Değer (örn: Kırmızı)" />
      <p-button icon="pi pi-trash" severity="danger" [text]="true" (onClick)="removeAttr(i)" />
    </div>
    <p-button label="Özellik Ekle" icon="pi pi-plus" severity="secondary" size="small" (onClick)="addAttr()" />
  </div>
  <ng-template pTemplate="footer">
    <p-button label="İptal" severity="secondary" (onClick)="variantDialogVisible = false" />
    <p-button label="Kaydet" (onClick)="saveVariant()" [loading]="saving()" />
  </ng-template>
</p-dialog>
