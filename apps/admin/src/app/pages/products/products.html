<div class="page">
  <div class="page-header">
    <h1>Ürünler</h1>
    <p-button label="Yeni Ürün" icon="pi pi-plus" (onClick)="openDialog()" />
  </div>

  <p-table [value]="products()" [loading]="loading()">
    <ng-template pTemplate="header">
      <tr>
        <th>Resim</th>
        <th>Ad</th>
        <th>Kategori</th>
        <th>Varyant</th>
        <th>Durum</th>
        <th>İşlem</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-product>
      <tr>
        <td>
          <img *ngIf="getMainImage(product)" [src]="getMainImage(product)" width="50" height="50" style="object-fit:cover;border-radius:6px;" />
          <span *ngIf="!getMainImage(product)">-</span>
        </td>
        <td>{{ product.name }}</td>
        <td>{{ product.category?.name ?? '-' }}</td>
        <td>{{ product.variants.length }}</td>
        <td>
          <p-tag [value]="product.isActive ? 'Aktif' : 'Pasif'"
                 [severity]="product.isActive ? 'success' : 'danger'" />
        </td>
        <td>
          <p-button icon="pi pi-eye" severity="info" [text]="true" (onClick)="goDetail(product.id)" />
          <p-button icon="pi pi-pencil" severity="secondary" [text]="true" (onClick)="openDialog(product)" />
          <p-button icon="pi pi-trash" severity="danger" [text]="true" (onClick)="delete(product.id)" />
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog [(visible)]="dialogVisible" [header]="editingId() ? 'Ürün Düzenle' : 'Yeni Ürün'"
          [modal]="true" [style]="{width: '500px'}">
  <div class="field">
    <label>Ad</label>
    <input pInputText [(ngModel)]="form.name" (ngModelChange)="autoSlug($event)" class="w-full" />
  </div>
  <div class="field">
    <label>Slug</label>
    <input pInputText [(ngModel)]="form.slug" class="w-full" />
  </div>
  <div class="field">
    <label>Açıklama</label>
    <textarea pTextarea [(ngModel)]="form.description" rows="3" class="w-full"></textarea>
  </div>
  <div class="field">
    <label>Kategori</label>
    <p-select [options]="categories()" optionLabel="name" optionValue="id"
              [(ngModel)]="form.categoryId" placeholder="Seç" [showClear]="true"
              appendTo="body" class="w-full" />
  </div>
  <ng-template pTemplate="footer">
    <p-button label="İptal" severity="secondary" (onClick)="dialogVisible = false" />
    <p-button label="Kaydet" (onClick)="save()" [loading]="saving()" />
  </ng-template>
</p-dialog>
