<div class="page">
  <div class="page-header">
    <h1>Markalar</h1>
    <p-button label="Yeni Marka" icon="pi pi-plus" (onClick)="openDialog()" />
  </div>

  <p-table [value]="brands()" [loading]="loading()">
    <ng-template pTemplate="header">
      <tr>
        <th>Ad</th>
        <th>Slug</th>
        <th>Durum</th>
        <th>İşlem</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-brand>
      <tr>
        <td>{{ brand.name }}</td>
        <td>{{ brand.slug }}</td>
        <td>
          <p-tag [value]="brand.isActive ? 'Aktif' : 'Pasif'"
                 [severity]="brand.isActive ? 'success' : 'danger'" />
        </td>
        <td>
          <p-button icon="pi pi-pencil" severity="secondary" [text]="true" (onClick)="openDialog(brand)" />
          <p-button icon="pi pi-trash" severity="danger" [text]="true" (onClick)="delete(brand.id)" />
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog [(visible)]="dialogVisible" [header]="editingId() ? 'Marka Düzenle' : 'Yeni Marka'"
          [modal]="true" [style]="{width: '400px'}">
  <div class="field">
    <label>Ad</label>
    <input pInputText [(ngModel)]="form.name" (ngModelChange)="autoSlug($event)" class="w-full" />
  </div>
  <div class="field">
    <label>Slug</label>
    <input pInputText [(ngModel)]="form.slug" class="w-full" />
  </div>
  <div class="field">
    <label>Logo URL</label>
    <input pInputText [(ngModel)]="form.logo" class="w-full" />
  </div>
  <ng-template pTemplate="footer">
    <p-button label="İptal" severity="secondary" (onClick)="dialogVisible = false" />
    <p-button label="Kaydet" (onClick)="save()" [loading]="saving()" />
  </ng-template>
</p-dialog>
