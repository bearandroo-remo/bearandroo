<div class="dashboard">
  <h1>Dashboard</h1>
  <div class="stats-grid">
    <div class="stat-card">
      <i class="pi pi-box"></i>
      <div>
        <span class="label">Toplam Ürün</span>
        <span class="value">{{ productCount() }}</span>
      </div>
    </div>
    <div class="stat-card">
      <i class="pi pi-tags"></i>
      <div>
        <span class="label">Toplam Kategori</span>
        <span class="value">{{ categoryCount() }}</span>
      </div>
    </div>
  </div>
</div>
