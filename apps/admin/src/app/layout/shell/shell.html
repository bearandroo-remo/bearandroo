<div class="shell">
  <header class="topbar">
    <p-button icon="pi pi-bars" severity="secondary" [text]="true" (onClick)="toggleMenu()" />
    <h3>Bearandroo Admin</h3>

    <!-- Super Admin tenant seçici -->
    <div *ngIf="isSuperAdmin()" class="tenant-selector">
      <p-select
        [options]="tenants()"
        optionLabel="name"
        (onChange)="selectTenant($event.value)"
        placeholder="Tenant Seç"
        appendTo="body"
        [style]="{minWidth: '150px'}"
      />
    </div>
  </header>

  <div class="body">
    <aside class="sidebar" [class.open]="menuOpen()">
      <nav>
        <ul>
          <li>
            <a routerLink="/dashboard" routerLinkActive="active" (click)="menuOpen.set(false)">
              <i class="pi pi-home"></i> Dashboard
            </a>
          </li>
          <li>
            <a routerLink="/products" routerLinkActive="active" (click)="menuOpen.set(false)">
              <i class="pi pi-box"></i> Ürünler
            </a>
          </li>
          <li>
            <a routerLink="/categories" routerLinkActive="active" (click)="menuOpen.set(false)">
              <i class="pi pi-tags"></i> Kategoriler
            </a>
          </li>
          <li>
            <a routerLink="/collections" routerLinkActive="active" (click)="menuOpen.set(false)">
              <i class="pi pi-th-large"></i> Koleksiyonlar
            </a>
          </li>
          <li>
            <a routerLink="/brands" routerLinkActive="active" (click)="menuOpen.set(false)">
              <i class="pi pi-bookmark"></i> Markalar
            </a>
          </li>
          <li>
            <a routerLink="/settings" routerLinkActive="active" (click)="menuOpen.set(false)">
              <i class="pi pi-cog"></i> Mağaza Ayarları
            </a>
          </li>
          <li>
            <a routerLink="/product-import" routerLinkActive="active" (click)="menuOpen.set(false)">
              <i class="pi pi-upload"></i> Excel Import
            </a>
          </li>
          <li *ngIf="isSuperAdmin()">
            <a routerLink="/tenants" routerLinkActive="active" (click)="menuOpen.set(false)">
              <i class="pi pi-building"></i> Tenantlar
            </a>
          </li>
        </ul>
      </nav>
      <div class="logout">
        <p-button label="Çıkış" icon="pi pi-sign-out" severity="secondary" (onClick)="logout()" />
      </div>
    </aside>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
